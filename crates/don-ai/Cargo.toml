[package]
name = "don-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Transcription of the shipped Rise of Nations production AI: the BHS host ABI, the AI cycle scheduler, economic.bhs, and a headless economic game it can play."

[dependencies]
# The derived economy (`Leader::do_gather` / `Player::UpdateCommerceCaps`) lives
# in don-sim's `mechanics`. `game.rs` calls it rather than re-deriving it.
don-sim = { path = "../don-sim" }
# The arena speaks `don-env`'s action heads directly rather than describing them, so a
# trained policy is a drop-in and a test can prove the mapping round-trips.
don-env = { path = "../don-env" }

[[bin]]
name = "ai-match"
path = "src/bin/ai_match.rs"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"
