[package]
name = "don-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Batch-parallel simulation core: world storage and the fixed-tick scheduler."

[dependencies]

[[bin]]
name = "don-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "don-tick-trace"
path = "src/bin/tick-trace.rs"

# The deviation registry, and the fidelity gate tools/replay-validate.sh runs.
[[bin]]
name = "don-deviations"
path = "src/bin/deviations.rs"
