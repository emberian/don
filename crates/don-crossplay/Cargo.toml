[package]
name = "don-crossplay"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Checked ABI for CrossplayProxy.dll: the shipped ICrossPlayService vtable, ICrossplayLogger, and the Lobby/Matchmaking DTO layouts. Interface only, no behaviour."

# Library only, and deliberately excluded from the root workspace (see
# ../../Cargo.toml) exactly like netsys-shim: the ABI it describes is
# i686-pc-windows-msvc, and `extern "thiscall"` only exists on x86. The layout
# and slot-order assertions are written so they are also checkable on the arm64
# host, so `cargo check -p don-crossplay --lib` is meaningful there too.

[lib]
name = "don_crossplay"
path = "src/lib.rs"

[features]
# The DoN-owned backend behind the ABI: `local`, `msvc` and `service`. On by
# default; `--no-default-features` leaves the crate as the pure interface
# description it started as, which is what a consumer that only wants the vtable
# layout should use.
default = ["local"]
local = []
# A DoN-owned loopback directory protocol. Kept opt-in so the checked ABI and
# allocator-only backend remain `no_std` for consumers that do not need local
# cross-process discovery.
std-rpc = ["local"]
# Stitch the DoN-owned Crossplay lobby lifecycle to don-net's explicit
# MatchStart and turn gate. Kept out of `std-rpc` so the configured replacement
# DLL does not acquire a networking-crate dependency or change its lifetime.
local-match = ["std-rpc", "dep:don-net"]

[[bin]]
name = "directory-rpc-peer"
path = "src/bin/directory-rpc-peer.rs"
required-features = ["std-rpc"]

[[bin]]
name = "service-match-peer"
path = "src/bin/service-match-peer.rs"
required-features = ["local-match"]

# No mandatory dependencies. The backend needs only an allocator; the
# headless product-path fixture opts into don-net explicitly.
[dependencies]
don-net = { path = "../don-net", optional = true }
