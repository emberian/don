[package]
name = "don-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Replay-driven validation harness: feed a real .rcx command stream into don-sim and compare our lockstep checksum channels against the recorded ones, turn by turn."

# No dependencies, by choice, for the same reason don-net has none: a green
# `cargo test` here must never depend on the crates.io registry. Decompression
# shells out to the system `gzip`, exactly as don-net's corpus tests do.
[dependencies]
don-bhs = { path = "../don-bhs" }
don-net = { path = "../don-net" }
don-sim = { path = "../don-sim" }

[[bin]]
name = "don-replay"
path = "src/bin/don-replay.rs"

[[bin]]
name = "don-closure"
path = "src/bin/don-closure.rs"
