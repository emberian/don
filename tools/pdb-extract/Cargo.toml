[package]
name = "pdb-extract"
version = "0.1.0"
edition = "2021"

# Standalone workspace: deliberately NOT a member of the repo root workspace, so
# `cargo test` at the repo root never builds this tool.
[workspace]

[dependencies]
pdb = "0.8"
msvc-demangler = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
