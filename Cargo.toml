[workspace]
resolver = "2"
members = ["crates/don-rules", "crates/don-pe", "crates/don-sim", "crates/don-gpu"]
# 32-bit x86 only; cannot build on arm64. See crates/oracle/README.md.
exclude = ["crates/oracle"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
