[workspace]
resolver = "2"
members = ["crates/don-rules", "crates/don-pe", "crates/don-sim", "crates/don-gpu", "crates/don-net", "crates/don-ai", "crates/don-env", "crates/don-replay"]
# oracle: 32-bit x86 only; cannot build on arm64. See crates/oracle/README.md.
# donscan: Windows-only (kernel32 FFI); cross-built with cargo-xwin. See crates/donscan/README.md.
exclude = ["crates/oracle", "crates/donscan"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
