[workspace]
resolver = "2"
members = [
    "crates/don-rules",
    "crates/don-pe",
    "crates/don-sim",
    "crates/don-gpu",
    "crates/don-net",
    "crates/don-ai",
    "crates/don-env",
    "crates/don-replay",
    "crates/don-bhs",
    "crates/don-bhs-cc",
    "crates/rontoy-core",
    "crates/rontoy-proto",
    "crates/don-content",
]
# oracle: 32-bit x86 only; cannot build on arm64. See crates/oracle/README.md.
# donscan: Windows-only (kernel32 FFI); cross-built with cargo-xwin. See crates/donscan/README.md.
# netsys-shim: i686-pc-windows-msvc cdylib loaded by the retail game. See crates/netsys-shim/README.md.
# don-crossplay: CrossplayProxy.dll ABI; `extern "thiscall"` only exists on x86. See crates/don-crossplay/README.md.
exclude = ["crates/oracle", "crates/donscan", "crates/netsys-shim", "crates/don-crossplay"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
